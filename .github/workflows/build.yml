name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Auto-locate project and Build APK
        run: |
          echo "=== 檢查目前上傳的檔案結構 ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          # 自動尋找 settings.gradle 所在的真實資料夾
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ 錯誤：找不到 settings.gradle，請確認剛才解壓縮的檔案有上傳成功！"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "✅ 找到專案目錄：$PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 開始編譯 APK
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LineFloatingMonitor-APK
          path: "**/app-debug.apk"
